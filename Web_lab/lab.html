<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Design Lab 6 - Layout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: flex;
      min-height: 80vh;
    }

    nav {
      width: 200px;
      background-color: #222;
      color: white;
      padding: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
    }

    nav ul li {
      margin: 15px 0;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      display: block;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: #555;
    }

    main {
      flex: 1;
      background-color: white;
      padding: 20px;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
     Web Design Lab 7
  </header>

  <div class="container">
    <nav>
      <ul>
        <li><a href="#">🏠 Home</a></li>
        <li><a href="#">📚 Lessons</a></li>
        <li><a href="#">🧠 Practice</a></li>
        <li><a href="#">📸 Gallery</a></li>
        <li><a href="#">📞 Contact</a></li>
      </ul>
    </nav>

    <main>
      <h2>Welcome to Web Design Lab!</h2>
    </main>
  </div>

  <footer>
    © 2025 Web Design Lab | Created by Me 🌟
  </footer>

</body>
</html>
