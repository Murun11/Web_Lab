<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Image with Keyboard</title>
</head>
<body>

<img src="photo.jpg" id="mushroom" 
     style="width: 200px; height: 200px; position: absolute; left: 0; top: 0;">

<script>
var im = document.getElementById('mushroom');

// Load үед байрлал тохируулах
window.addEventListener('load', () => {
  im.style.left = "0px";
  im.style.top  = "0px";
});

// Keyboard удирдлага
document.onkeydown = function(e) {
  switch(e.key) {
    case "a":  // Зүүн
      im.style.left = parseInt(im.style.left) - 50 + "px";
      break;
    case "d":  // Баруун
      im.style.left = parseInt(im.style.left) + 50 + "px";
      break;
    case "w":  // Дээш
      im.style.top = parseInt(im.style.top) - 50 + "px";
      break;
    case "s":  // Доош
      im.style.top = parseInt(im.style.top) + 50 + "px";
      break;
  }
}
</script>

</body>
</html>
